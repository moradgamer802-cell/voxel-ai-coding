name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (matches pyproject.toml)"
        required: true
        default: "0.1.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            python/zyvo
            pyproject.toml
            README.md
            LICENSE
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Check version matches
        run: |
          PYPROJ_VERSION="$(grep -m1 '^version' pyproject.toml | sed 's/.*= *"\([^"]*\)".*/\1/')"
          INPUT_VERSION="${{ inputs.version }}"
          if [ "$PYPROJ_VERSION" != "$INPUT_VERSION" ]; then
            echo "Version mismatch: pyproject.toml says $PYPROJ_VERSION, you entered $INPUT_VERSION"
            exit 1
          fi
          echo "Version OK: $PYPROJ_VERSION"
      - name: Build
        run: python -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: "${{ secrets.PYPI_TOKEN }}"
        run: twine upload dist/*